# Pricing-rule parameters. See phillyparking.pricing.* for consumers.

seattle_rule:
  # One price per zone x time-of-day band (bands: scenarios.yaml time_of_day_bands).
  # Statistic: the band's average capacity-weighted zone occupancy over the zone's
  # priced hours, as in SDOT's 2024 Paid Parking report. [occ_low, occ_high] is the
  # dead band in which the rate holds.
  step_usd: 0.50
  occ_high: 0.85          # if band_occ > occ_high → +step
  occ_low: 0.70           # if band_occ < occ_low → −step
  # Optional second tier: if band_occ >= occ_very_high, raise by 2*step.
  occ_very_high: 0.95
  # Max number of step increments per adjustment cycle.
  max_step_per_cycle: 2

chatman_manville:
  # The targeting rules of the Chatman-Manville sweep (pricing/targeting_rules.py). Every
  # rule steps +-step_usd on its own statistic against the same band: above occ_high raise,
  # below occ_low cut, inside hold. The rules differ only in the statistic and its window.
  # min_vacancy_peak raises when the peak_quantile of occupancy exceeds occ_high, i.e. when
  # fewer than 1 - occ_high of spaces are vacant at the busiest hours. A guard test keeps
  # this band equal to seattle_rule's.
  occ_low: 0.70
  occ_high: 0.85
  step_usd: 0.50
  peak_quantile: 0.95

arnott_inci:
  # Target vacancy at which cruising is just eliminated.
  target_vacancy: 0.15
  # Value of time for cruising drivers (USD/hour). 2024 USDOT default for local
  # personal travel ≈ $17.90; bump for downtown trips with higher avg income.
  value_of_time_usd_per_hr: 20.00

# The project's one cruising-cost model (welfare/search_cost.py), used by the scenario
# table's search-cost row and by the Chatman-Manville sweep's welfare scorer.
# Shape: a block of K spaces at mean occupancy o is full with probability o^K, and an
# arriving driver passes p/(1-p) full blocks. A full block is scored at occupancy_cap rather
# than 1 (turnover frees a space eventually; above the cap drivers give up or park
# elsewhere), so the cap decides how much more a full block costs than a 95% one: at 0.99 a
# full 10-space block costs 6.3x the 95% block, at 0.95 the same, at 0.999 67x. The sweep
# varies the cap (config/scenarios.yaml chatman_manville_sweep.occupancy_cap).
# Level: minutes_at_full_block is the expected search time of an arrival at a full block of
# reference_capacity spaces, the quantity that drives the cost on a priced panel. It is
# stated, not measured. cited_cruising_minutes is the range of the studies Shoup (2006,
# "Cruising for parking", Transport Policy 13(6), Table 1) collects: the AVERAGE CRUISING
# TIME OF THE DRIVERS WHO CRUISE, not the expected search time of all arrivals. Under this
# model cap^K of the arrivals at a full block cruise (0.90 at the default cap on 10 spaces),
# so the per-arrival figure is cap^K times the per-cruiser one; the level is set at the
# cited mean, which puts it at the top of what that mean implies per arrival. Arrivals per
# hour are the served cars divided by mean_duration_hr (a stated 90-minute mean stay); the
# value of time is arnott_inci's. No Philadelphia measurement of any of these exists.
search_cost:
  minutes_at_full_block: 8.1
  reference_occupancy: 0.95
  reference_capacity: 10
  mean_duration_hr: 1.5
  occupancy_cap: 0.99     # a full block costs a finite search; above this drivers give up
  cited_cruising_minutes:
    low: 3.5
    high: 14.0
    mean: 8.1
    source: "Shoup (2006) Table 1: average cruising time of those who cruise, 16 studies 1927-2001"

# No-go bounds applied after every algorithm; never let prices drift outside these.
global_floor_usd: 0.50
global_ceiling_usd: 10.00
