# Absolute anchors for the synthetic baseline occupancy (demand/synthetic_baseline.py).
#
# A segment's baseline depends only on its own covariates and these numbers, never on which
# other segments are loaded. Each covariate enters as z = (log1p(x) - center) / scale; the
# latent intensity is lambda = sum(intensity_weight * z); a segment at lambda <= intensity_low
# peaks at low_demand_peak, one at lambda >= intensity_high peaks at peak_target, linear in
# between.
#
# The centers, scales and intensity bounds belong to a reference set of segments, so there is
# one anchor set per kind of segment (`anchor_sets`). baseline_occupancy picks the set from
# the segments' recorded source (`segments.attrs["segment_source"]["kind"]`, mapped by
# `anchor_set_for_source`) or takes one by name, and refuses segments with no recorded source.
# In every set a center is the mean and a scale the standard deviation of log1p(covariate)
# over the reference set, and intensity_low / intensity_high are its 5th and 95th percentiles
# of lambda, so about 5% of the reference set sits at each end.
#
# STATED, NOT MEASURED. The anchors place a segment relative to its reference set; how busy
# that makes it comes from the occupancy levels below, which are assumptions. Once the
# Parking Authority panel exists, observed occupancy replaces this baseline for the segments
# it covers, and the levels should be fitted to it.

covariates:
  jobs_within_200m:     { intensity_weight: 0.55, mix_weight: 1.0 }
  pois_count:           { intensity_weight: 0.35, mix_weight: 1.2 }
  pop_density:          { intensity_weight: 0.25, mix_weight: 0.9 }
  transit_trips_per_hr: { intensity_weight: -0.15 }

anchor_sets:
  # The demo fixture, make_synthetic_segments(n=120, seed=42), rounded.
  synthetic_fixture:
    reference: make_synthetic_segments(n=120, seed=42)
    centers: { jobs_within_200m: 7.62, pois_count: 3.17, pop_density: 9.74, transit_trips_per_hr: 2.70 }
    scales:  { jobs_within_200m: 1.07, pois_count: 0.97, pop_density: 0.72, transit_trips_per_hr: 0.91 }
    intensity_low: -1.22
    intensity_high: 1.25

  # BEGIN philadelphia (generated by scripts/derive_baseline_anchors.py; do not edit by hand)
  philadelphia:
    reference: "priced curb of data/processed/segments.parquet, n=3145; no meter inventory: street_class in [2, 3, 4, 5] and commercial_frontage_share >= 0.5"
    centers: { jobs_within_200m: 7.95, pois_count: 1.48, pop_density: 8.65, transit_trips_per_hr: 5.36 }
    scales:  { jobs_within_200m: 1.56, pois_count: 0.95, pop_density: 1.90, transit_trips_per_hr: 0.67 }
    intensity_low: -1.21
    intensity_high: 1.26
  # END philadelphia

# Which anchor set each recorded segment source uses.
source_anchor_sets:
  synthetic_fixture: synthetic_fixture
  file: philadelphia            # data/processed/segments.parquet from scripts/02
  ppa_inventory: philadelphia

# Occupancy levels (unsourced calibration assumptions; audit findings 1 and 25), shared by
# every anchor set.
peak_target: 0.92        # weekly peak of a segment at or above intensity_high
low_demand_peak: 0.62    # weekly peak of a segment at or below intensity_low
offpeak_floor: 0.20      # weekly minimum at intensity_low (rises by offpeak_span at the top)
offpeak_span: 0.10
mix_temperature: 2.5     # sharpens the office / retail / residential land-use softmax

# baseline_occupancy warns when more than this share of segments sits at the cap or the floor:
# the anchors then do not suit the covariates loaded.
max_clipped_share: 0.20
